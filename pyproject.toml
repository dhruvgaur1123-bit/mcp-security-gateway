[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-gateway"
version = "0.1.0"
description = "Policy-enforcing security proxy for MCP servers: prompt-injection, PII, and tool-poisoning defences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
mcpgw = "mcpgw.cli:main"

[tool.setuptools]
packages = ["mcpgw"]
